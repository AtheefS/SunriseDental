<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Appointment - Sunrise Dental</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">

        <div class="dashboard-card">

            <h1>Register New Appointment</h1>

            <p class="subtitle">
                Sunrise Dental Clinic
            </p>

            <form id="appointmentForm">

                <label>Patient Name</label>
                <input
                    type="text"
                    id="patientName"
                    placeholder="Enter patient name"
                    pattern="[A-Za-z ]{2,100}"
                    minlength="2"
                    maxlength="100"
                    required
                >

                <label>Address</label>
                <input
                    type="text"
                    id="address"
                    placeholder="Enter address"
                    required
                >

                <label>Contact Number</label>
                <input
                 type="tel"
                 id="contactNumber"
                 placeholder="Enter 10-digit contact number"
                 pattern="0[0-9]{9}"
                 maxlength="10"
                 minlength="10"
                 inputmode="numeric"
                 required
                >

                <label>Dentist</label>
                <select id="dentistId" required>
                    <option value="">Select Dentist</option>
                </select>

                <label>Treatment</label>
                <select id="treatmentId" required>
                    <option value="">Select Treatment</option>
                </select>

                <label>Appointment Date</label>
                <input
                    type="date"
                    id="appointmentDate"
                    required
                >

                <label>Appointment Time</label>
                <input
                  type="time"
                  id="appointmentTime"
                  min="08:00"
                  max="18:00"
                  step="1800"
                  required
                >

                <button type="submit">
                    Register Appointment
                </button>

                <button type="button" onclick="goDashboard()">
                    Back to Dashboard
                </button>

                <p id="appointmentMessage"></p>

            </form>

        </div>

    </div>

    <script>

        const API = "";

        // Load dentists
        async function loadDentists() {

            try {

                const response =
                    await fetch(API + "/api/dentists");

                const dentists =
                    await response.json();

                const select =
                    document.getElementById("dentistId");

                dentists.forEach(function (dentist) {

                    const option =
                        document.createElement("option");

                       option.value = dentist.id;
                       option.textContent = dentist.name;
                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

            }
        }


       async function loadTreatments() {

    try {

        const response = await fetch(API + "/api/treatments");

        const treatments = await response.json();

        console.log("Treatments:", treatments);

        const select = document.getElementById("treatmentId");

        treatments.forEach(function (treatment) {

            const option = document.createElement("option");

            option.value = treatment.id;

            option.textContent =
                treatment.name + " - Rs. " + treatment.cost;

            select.appendChild(option);

        });

    } catch (error) {

        console.error("Treatment loading error:", error);

    }
}


        // Register appointment
        document
            .getElementById("appointmentForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const message =
                    document.getElementById("appointmentMessage");

                message.textContent =
                    "Registering appointment...";

                const data = {

                    patientName:
                        document.getElementById("patientName").value.trim(),

                    address:
                        document.getElementById("address").value.trim(),

                    contactNumber:
                        document.getElementById("contactNumber").value.trim(),

                    dentistId:
                        document.getElementById("dentistId").value,

                    treatmentId:
                        document.getElementById("treatmentId").value,

                    appointmentDate:
                        document.getElementById("appointmentDate").value,

                    appointmentTime:
                        document.getElementById("appointmentTime").value

                };

                try {

                    const response =
                        await fetch(API + "/api/appointments", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(data)

                        });

                    const result =
                        await response.json();

                    if (result.success) {

                        message.textContent =
                            "Appointment registered successfully. Appointment Number: "
                            + result.appointmentNumber;

                        document
                            .getElementById("appointmentForm")
                            .reset();

                    } else {

                        message.textContent =
                            result.message ||
                            "Unable to register appointment.";

                    }

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to the Java server.";

                }

            });


        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        loadDentists();
        loadTreatments();

    </script>

</body>

</html>
