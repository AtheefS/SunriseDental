<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generate Bill - Sunrise Dental</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">

        <div class="dashboard-card">

            <h1>Generate Bill</h1>

            <p class="subtitle">
                Sunrise Dental Clinic
            </p>

            <label for="appointmentNumber">
                Appointment Number
            </label>

            <input
                type="text"
                id="appointmentNumber"
                placeholder="Enter appointment number"
            >

            <button onclick="generateBill()">
                Calculate Bill
            </button>

            <div id="billResult"></div>

            <button onclick="goDashboard()">
                Back to Dashboard
            </button>

        </div>

    </div>

    <script>

        const API = "";

        async function generateBill() {

            const appointmentNumber =
                document.getElementById("appointmentNumber")
                .value.trim();

            const result =
                document.getElementById("billResult");

            if (!appointmentNumber) {

                result.innerHTML =
                    "<p>Please enter an appointment number.</p>";

                return;
            }

            try {

                // First find the appointment
                const appointmentResponse =
                    await fetch(
                        API +
                        "/api/appointments?number=" +
                        encodeURIComponent(appointmentNumber)
                    );

                const appointment =
                    await appointmentResponse.json();

                if (!appointment.success) {

                    result.innerHTML =
                        "<p>Appointment not found.</p>";

                    return;
                }

                // Generate bill
                const billResponse =
                    await fetch(API + "/api/bills", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            appointmentId:
                                appointment.appointmentId,

                            treatmentId:
                                appointment.treatmentId

                        })

                    });

                const bill =
                    await billResponse.json();

                if (!bill.success) {

                    result.innerHTML =
                        "<p>" +
                        (bill.message || "Unable to generate bill.") +
                        "</p>";

                    return;
                }

                result.innerHTML = `

                    <div class="appointment-result">

                        <h2>Sunrise Dental Clinic</h2>

                        <h3>Patient Bill</h3>

                        <p>
                            <strong>Appointment Number:</strong>
                            ${appointment.appointmentNumber}
                        </p>

                        <p>
                            <strong>Patient Name:</strong>
                            ${appointment.patientName}
                        </p>

                        <p>
                            <strong>Treatment:</strong>
                            ${appointment.treatmentName}
                        </p>

                        <hr>

                        <p>
                            <strong>Consultation Fee:</strong>
                            Rs. ${bill.consultationFee}
                        </p>

                        <p>
                            <strong>Treatment Cost:</strong>
                            Rs. ${bill.treatmentCost}
                        </p>

                        <h2>
                            Total: Rs. ${bill.totalAmount}
                        </h2>

                        <button onclick="window.print()">
                            Print Bill
                        </button>

                    </div>

                `;

            } catch (error) {

                console.error(error);

                result.innerHTML =
                    "<p>Unable to connect to the Java server.</p>";
            }
        }

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }

    </script>

</body>

</html>
